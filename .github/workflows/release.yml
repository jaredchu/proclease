name: Release binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'scripts/package-release.py', 'scripts/check-release.py', 'scripts/check-installer.py', 'install.sh', 'src/**', 'tests/**', 'Cargo.toml', 'Cargo.lock']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check native architecture
        run: |
          rustc -vV | grep 'host: ${{ matrix.target }}'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          PROCLEASE_TEST_ROOT: ${{ runner.temp }}/proclease
          RUST_BACKTRACE: 1
      - run: cargo build --locked --release
      - name: Package and smoke-test the archive
        env:
          PROCLEASE_TEST_ROOT: ${{ runner.temp }}/proclease
        run: |
          python scripts/package-release.py --target '${{ matrix.target }}' --binary target/release/proclease --output artifacts
          python scripts/check-release.py artifacts/*.tar.gz
          python scripts/check-installer.py artifacts/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proclease-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
  verify-artifacts:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exercise the same download and checksum steps used by the tag job.
      - &download_release_artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proclease-*
          path: artifacts
          merge-multiple: true
      - &verify_release_artifacts
        name: Verify four native archives and assemble checksums
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          cd artifacts
          shopt -s nullglob
          archives=("proclease-v${version}-"*.tar.gz)
          if [ "${#archives[@]}" -ne 4 ]; then
            echo "Expected four native archives, found ${#archives[@]}" >&2
            exit 1
          fi
          : > SHA256SUMS
          for archive in "${archives[@]}"; do
            checksum=$(sha256sum -- "$archive")
            if [ "$checksum" != "$(cat "$archive.sha256")" ]; then
              echo "Missing or incorrect checksum for $archive" >&2
              exit 1
            fi
            printf '%s\n' "$checksum" >> SHA256SUMS
          done
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Sign build provenance with a short-lived Sigstore certificate and
      # store the attestation on GitHub.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm the version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - *download_release_artifacts
      - *verify_release_artifacts
      # Before the release is drafted, so every published archive and the
      # installer already carry provenance that `gh attestation verify`
      # checks against this repository and workflow.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            install.sh
      - name: Draft the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* install.sh --verify-tag --draft --prerelease --title "ProcLease $TAG experimental preview" --notes-file "docs/releases/$TAG.md"
