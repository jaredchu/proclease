[package]
name = "proclease"
version = "0.1.8"
edition = "2021"
rust-version = "1.89"
description = "Put an explicit lifetime on development processes started by coding agents"
homepage = "https://proclease.com"
repository = "https://github.com/jaredchu/proclease"
license = "MIT"
readme = "README.md"
keywords = ["process", "lease", "dev-server", "coding-agent", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
# Source package: build and test inputs, the portable skill, README and license.
include = [
    "/src/",
    "/tests/",
    "/skills/proclease/SKILL.md",
    "/README.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
humantime = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4"] }
unicode-width = { version = "=0.2.2", default-features = false }
sysinfo = { version = "=0.33.1", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# Build scripts, procedural macros and their dependencies run on the host only
# during the build. Cargo applies the release `strip` setting to them as well.
# On macOS with Rust 1.89, a stripped `clap_derive` proc-macro library failed to
# load (E0463). Leaving host build units unstripped avoids this; the shipped
# `proclease` binary remains stripped and thin-LTO optimized.
[profile.release.build-override]
strip = false
